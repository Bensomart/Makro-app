<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Makro-Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#151518;--line:#26262b;--tx:#f3f0e9;--mut:#8f8b83;--acc:#dcbb78;--onacc:#17120a;--btn:#222227;--btn2:#2a2a30;--inp:#0e0e11;--track:#26262b;--navbg:#0b0b0dee;--warn:#e8a04c;--bad:#f07167;--kh:#86b6f6;--pr:#8fd9b0;--ft:#f0b46a;--serif:'Fraunces',Georgia,serif;--font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:16px;--r:22px;--rb:99px;--ri:16px;--accbg:color-mix(in srgb,var(--acc) 15%,transparent)}
html[data-mode=light]{--warn:#b5670f;--bad:#c9473d;--kh:#3b7bd4;--pr:#2a9a66;--ft:#d6861c}
/* 1 Edel: Serifen, weiche Karten */
html[data-design=edel][data-mode=light]{--bg:#f5f3ee;--card:#ffffff;--line:#e3dfd6;--tx:#1c1b18;--mut:#76726a;--acc:#96701c;--onacc:#fff;--btn:#ebe8e1;--btn2:#ffffff;--inp:#faf9f6;--track:#e6e2da;--navbg:#f5f3eeee}
html[data-design=edel][data-mode=light] .card{box-shadow:0 1px 2px #0000000f,0 0 0 1px var(--line)}
/* 2 Schlicht: keine Karten, Haarlinien, viel Weißraum */
html[data-design=schlicht]{--bg:#0e0e0f;--card:transparent;--line:#2b2b2d;--tx:#f4f4f4;--mut:#8b8b8e;--acc:#f4f4f4;--onacc:#0e0e0f;--btn:transparent;--btn2:#2b2b2d;--inp:transparent;--track:#2b2b2d;--navbg:#0e0e0ff2;--serif:var(--font);--r:0px;--rb:10px;--ri:10px}
html[data-design=schlicht][data-mode=light]{--bg:#ffffff;--line:#e4e4e4;--tx:#111111;--mut:#7a7a7a;--acc:#111111;--onacc:#fff;--btn2:#ededed;--track:#ececec;--navbg:#fffffff2}
html[data-design=schlicht] .card{padding:22px 2px;margin:0;border-bottom:1px solid var(--line)}
html[data-design=schlicht] h1{font-weight:300;font-size:36px;letter-spacing:-.03em;margin:18px 0 8px}
html[data-design=schlicht] h2{font-weight:500;font-size:19px}
html[data-design=schlicht] .big,html[data-design=schlicht] .hero .kc,html[data-design=schlicht] .ring .in{font-weight:300}
html[data-design=schlicht] button,html[data-design=schlicht] .btn{border:1px solid var(--line)}
html[data-design=schlicht] button.pri,html[data-design=schlicht] nav button,html[data-design=schlicht] button.ghost,html[data-design=schlicht] .seg button{border-color:transparent}
html[data-design=schlicht] .seg{border:1px solid var(--line)}
html[data-design=schlicht] nav button.on svg{background:none;padding:0;margin-top:0}
html[data-design=schlicht] nav button.on{font-weight:700}
html[data-design=schlicht] .msg.ai{border:1px solid var(--line)}
/* 3 Technik: Monospace, harte Kanten, Rahmen */
html[data-design=technik]{--bg:#050806;--card:#0a100c;--line:#1f3a27;--tx:#c8f4d2;--mut:#5f8f6c;--acc:#3dff8b;--onacc:#03130a;--btn:#0f1a13;--btn2:#17291c;--inp:#050806;--track:#14261a;--navbg:#050806f5;--font:"JetBrains Mono",ui-monospace,Menlo,monospace;--serif:var(--font);--fs:14px;--r:3px;--rb:3px;--ri:3px;--kh:#5cc8ff;--pr:#3dff8b;--ft:#ffc857}
html[data-design=technik][data-mode=light]{--bg:#f3f0e6;--card:#fbf9f1;--line:#1d1d1b;--tx:#1d1d1b;--mut:#6c6a62;--acc:#0b6b3a;--onacc:#fff;--btn:#e9e5d6;--btn2:#fbf9f1;--inp:#fffdf6;--track:#dcd7c6;--navbg:#f3f0e6f5;--kh:#1f6fb5;--pr:#0b6b3a;--ft:#b86b00}
html[data-design=technik] .card{border:1px solid var(--line)}
html[data-design=technik] h1{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
html[data-design=technik] h1::before{content:'> ';color:var(--acc)}
html[data-design=technik] h2{font-size:16px;font-weight:700}
html[data-design=technik] h3::before{content:'# '}
html[data-design=technik] button,html[data-design=technik] .btn{border:1px solid var(--line);text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}
html[data-design=technik] nav button,html[data-design=technik] button.ghost{border-color:transparent;text-transform:none}
html[data-design=technik] nav button{font-size:10px}
html[data-design=technik] nav button.on svg{border-radius:3px}
html[data-design=technik] .bar,html[data-design=technik] .bar>i,html[data-design=technik] .split,html[data-design=technik] .th,html[data-design=technik] .tag,html[data-design=technik] .msg,html[data-design=technik] .imgs div{border-radius:2px}
html[data-design=technik] .big{font-size:30px;font-weight:700}html[data-design=technik] .hero .kc{font-size:52px;font-weight:700}html[data-design=technik] .ring .in{font-size:17px;font-weight:700}
/* 4 Pop: fette Schrift, dicke Konturen, harte Schatten */
html[data-design=pop]{--bg:#1a1430;--card:#271f45;--line:#0c0918;--tx:#fff7ea;--mut:#b5aad4;--acc:#ffd23f;--onacc:#1a1430;--btn:#372c5e;--btn2:#4a3c82;--inp:#140e26;--track:#3b3066;--navbg:#1a1430f5;--font:"Nunito",system-ui,sans-serif;--serif:var(--font);--r:26px;--rb:18px;--ri:18px;--kh:#5cb8ff;--pr:#4fe3a1;--ft:#ff9f52}
html[data-design=pop][data-mode=light]{--bg:#fff3d9;--card:#ffffff;--line:#1c1c1c;--tx:#1c1c1c;--mut:#6f675b;--acc:#ff6b4a;--onacc:#fff;--btn:#ffe5ad;--btn2:#ffffff;--inp:#ffffff;--track:#f0e1bd;--navbg:#fff3d9f5;--kh:#2f8fe6;--pr:#19a86b;--ft:#f08a1c}
html[data-design=pop] body{font-weight:600}
html[data-design=pop] .card{border:2.5px solid var(--line);box-shadow:0 5px 0 var(--line)}
html[data-design=pop] h1{font-weight:900;font-size:31px}html[data-design=pop] h2{font-weight:900}
html[data-design=pop] .big,html[data-design=pop] .hero .kc,html[data-design=pop] .ring .in{font-weight:900}
html[data-design=pop] button,html[data-design=pop] .btn{border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800}
html[data-design=pop] button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
html[data-design=pop] nav button,html[data-design=pop] button.ghost,html[data-design=pop] .seg button{border-color:transparent;box-shadow:none}
html[data-design=pop] .seg{border:2.5px solid var(--line)}
html[data-design=pop] input,html[data-design=pop] textarea,html[data-design=pop] select{border:2.5px solid var(--line)}
html[data-design=pop] .bar{height:10px;border:2px solid var(--line);box-sizing:content-box}
html[data-design=pop] nav{border-top:2.5px solid var(--line)}
html[data-design=pop] .msg{border:2.5px solid var(--line)}
/* 5 Glas: ruhiger Verlauf, Milchglas-Flächen */
html[data-design=glas]{--bg:#0d1117;--card:#ffffff0f;--line:#ffffff1c;--tx:#f2f4f8;--mut:#9aa3b5;--acc:#a9c7ff;--onacc:#0b1424;--btn:#ffffff17;--btn2:#ffffff2b;--inp:#00000038;--track:#ffffff1f;--navbg:#0d1117b3;--serif:var(--font);--r:24px;--rb:99px;--ri:16px}
html[data-design=glas] body{background-image:radial-gradient(120% 60% at 0% 0%,#1d2a44 0,transparent 60%),radial-gradient(90% 50% at 100% 100%,#16302f 0,transparent 60%)}
html[data-design=glas][data-mode=light]{--bg:#eef1f5;--card:#ffffffa8;--line:#ffffff;--tx:#1b2130;--mut:#667089;--acc:#3857c9;--onacc:#fff;--btn:#ffffffb8;--btn2:#ffffff;--inp:#ffffffb8;--track:#1b21301a;--navbg:#eef1f5b8}
html[data-design=glas][data-mode=light] body{background-image:radial-gradient(120% 60% at 0% 0%,#dfe7f6 0,transparent 60%),radial-gradient(90% 50% at 100% 100%,#e3efe9 0,transparent 60%)}
html[data-design=glas] .card,html[data-design=glas] .msg.ai{border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-design=glas][data-mode=light] .card{box-shadow:0 8px 24px #1b21300f}
html[data-design=glas] nav{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-design=glas] h1{font-weight:700;font-size:29px;letter-spacing:-.02em}
html[data-design=glas] .big,html[data-design=glas] .hero .kc,html[data-design=glas] .ring .in{font-weight:700}
/* Akzentfarben (überschreiben die Farbe des Designs) */
html[data-style=gold][data-style]{--acc:#dcbb78;--onacc:#17120a}html[data-style=gold][data-mode=light]{--acc:#96701c;--onacc:#fff}
html[data-style=mint][data-style]{--acc:#5fe0b5;--onacc:#062019}html[data-style=mint][data-mode=light]{--acc:#0c8a65;--onacc:#fff}
html[data-style=blau][data-style]{--acc:#7fb2ff;--onacc:#07162e}html[data-style=blau][data-mode=light]{--acc:#2460d6;--onacc:#fff}
html[data-style=beere][data-style]{--acc:#f08fb0;--onacc:#2b0a17}html[data-style=beere][data-mode=light]{--acc:#bd3267;--onacc:#fff}
html[data-style=orange][data-style]{--acc:#f2954d;--onacc:#2a1203}html[data-style=orange][data-mode=light]{--acc:#c2611a;--onacc:#fff}
html[data-style=tuerkis][data-style]{--acc:#4fd1d9;--onacc:#04201f}html[data-style=tuerkis][data-mode=light]{--acc:#0f7f88;--onacc:#fff}
html[data-style=violett][data-style]{--acc:#a78bfa;--onacc:#170b36}html[data-style=violett][data-mode=light]{--acc:#5b3fb5;--onacc:#fff}
html[data-style=wald][data-style]{--acc:#3f9a72;--onacc:#fff}html[data-style=wald][data-mode=light]{--acc:#1f6b4b;--onacc:#fff}
html[data-style=marine][data-style]{--acc:#4a6fd0;--onacc:#fff}html[data-style=marine][data-mode=light]{--acc:#23408f;--onacc:#fff}
html[data-style=wein][data-style]{--acc:#b84a63;--onacc:#fff}html[data-style=wein][data-mode=light]{--acc:#8a2740;--onacc:#fff}
html[data-style=graphit][data-style]{--acc:#8e97a8;--onacc:#10131a}html[data-style=graphit][data-mode=light]{--acc:#4a5261;--onacc:#fff}
html[data-style=neutral][data-style]{--acc:#ffffff;--onacc:#111111}html[data-style=neutral][data-mode=light]{--acc:#151515;--onacc:#fff}
/* Animationen (nur beim Wechsel der Ansicht und bei neuem Ergebnis) */
@keyframes inL{from{opacity:0;transform:translateX(46px)}}
@keyframes inR{from{opacity:0;transform:translateX(-46px)}}
#app.anim.sl>*{animation:inL .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:0s!important}
#app.anim.sr>*{animation:inR .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:0s!important}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes ringIn{from{stroke-dasharray:0 999}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-5px) scale(1.08)}100%{transform:translateY(0)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
#app.anim>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
#app.anim>*:nth-child(2){animation-delay:.05s}#app.anim>*:nth-child(3){animation-delay:.1s}#app.anim>*:nth-child(4){animation-delay:.15s}#app.anim>*:nth-child(5){animation-delay:.2s}#app.anim>*:nth-child(6){animation-delay:.25s}#app.anim>*:nth-child(n+7){animation-delay:.3s}
#app.anim .bar>i{transform-origin:left;animation:growX .8s .2s cubic-bezier(.2,.8,.2,1) both}
#app.anim .split i{transform-origin:left;animation:growX .8s .5s cubic-bezier(.2,.8,.2,1) both}
#app.anim .chart .c i{transform-origin:bottom;animation:growY .7s .15s cubic-bezier(.2,.8,.2,1) both}
#app.anim .ring circle:nth-child(2){animation:ringIn 1s .25s cubic-bezier(.2,.8,.2,1) both}
#app.anim .hero .kc{animation:pop .55s .1s both}
#app.anim .msg:last-of-type{animation:pop .35s both}
#nav.anim button.on svg{animation:hop .4s}
label.btn:active .ib svg{animation:sway .5s}
button,.btn{transition:transform .12s,background-color .2s}
button:active,.btn:active{transform:scale(.97)}
.bar>i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
#toast{transform:translate(-50%,10px) scale(.96);transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.3)}
#toast.on{transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.dz{display:block;width:100%;text-align:left;margin-top:8px;border-radius:var(--ri)!important;padding:12px 14px}.dz.on{outline:2px solid var(--acc);outline-offset:1px}.dz small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;text-transform:none;letter-spacing:0}
.sw{width:44px;height:44px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent;flex:none}.sw.on{border-color:var(--tx)}.sw{box-shadow:inset 0 0 0 1px #8886!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 var(--font);background-attachment:fixed;-webkit-font-smoothing:antialiased}
body{padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font:600 28px/1.15 var(--serif);margin:10px 0 16px;letter-spacing:-.01em}
h2{font:600 22px/1.2 var(--serif);margin:26px 2px 10px}
h3{font-size:11px;margin:14px 0 8px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
a{color:var(--acc)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:13px}.big{font:600 38px/1.05 var(--serif)}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;color:var(--tx);background:var(--btn);border:0;border-radius:var(--rb);padding:11px 18px;cursor:pointer;min-height:46px;font-weight:500}
button.pri{background:var(--acc);color:var(--onacc);font-weight:700}
button.ghost{background:none;border-color:transparent;color:var(--acc);padding:8px}
button.dng{color:var(--bad)}
button:disabled{opacity:.5}
.full{width:100%}
input,textarea,select{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--line);border-radius:var(--ri);padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc)}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar>i.over{background:var(--warn)}
.mac{flex:1;text-align:center}
.mac b{display:block;font-size:13px;margin-top:5px}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.meal:first-of-type{border-top:0}
.th{color:var(--mut);width:56px;height:56px;border-radius:16px;background:var(--btn) center/cover;flex:none;display:grid;place-items:center;font-size:22px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;background:var(--btn);color:var(--mut);border:1px solid transparent;white-space:nowrap}
.tag.ok{color:var(--acc);border-color:var(--acc)}
.tag.w{color:var(--warn);border-color:var(--warn)}
.cpy{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cpy:first-child{border-top:0}
.cpy .l{width:124px;color:var(--mut);font-size:13px;flex:none}
.cpy .v{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.cpy button{min-height:38px;padding:6px 12px}
.comp{padding:10px 0;border-top:1px solid var(--line)}
.comp:first-child{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;border-radius:12px;color:var(--mut);font-size:11.5px;font-weight:500;min-width:56px;min-height:0;padding:8px 4px 4px;flex:1}
nav button.on{color:var(--acc)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:10px}
nav button svg{display:block;margin:0 auto 3px;width:26px;height:26px;padding:0;box-sizing:content-box;stroke-width:1.8}
nav button.on svg{background:var(--accbg);border-radius:99px;padding:4px 14px;margin-top:-4px}
._fab{position:fixed;right:18px;bottom:88px;width:60px;height:60px;border-radius:50%;font-size:30px;padding:0;background:var(--acc);color:var(--onacc);border:0;box-shadow:0 6px 20px #0008}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.imgs div{position:relative;width:84px;height:84px;border-radius:12px;background:#222 center/cover}
.imgs b{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer}
.spin{width:22px;height:22px;border:3px solid var(--track);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:14px;margin-top:8px;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;position:relative;margin-top:26px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.chart .c i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.chart .c i.over{background:var(--warn)}.chart .c i.none{background:var(--track)}
.chart .c em{font-style:normal;font-size:11px;color:var(--mut);margin-bottom:3px}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--mut);font-size:10px;color:var(--mut);text-align:right;pointer-events:none}
.days{display:flex;gap:8px;margin-top:4px}.days span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.mic span:last-child{white-space:nowrap}
.mic{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:500;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
#toast.on{opacity:1}
details summary{cursor:pointer;color:var(--tx);padding:4px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';color:var(--acc);font-size:20px;line-height:1}
details[open] summary::after{content:'–'}
.hero{text-align:center;padding:26px 18px 20px}
.hero .kc{font:600 68px/1 var(--serif);letter-spacing:-.02em}
.hero .kc small{font:500 15px var(--font);color:var(--mut);margin-left:6px;letter-spacing:0}
.rings{display:flex;justify-content:space-around;margin-top:22px}
.ring{position:relative;width:92px;cursor:pointer}
.ring svg{display:block;width:92px;height:92px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0 0 auto 0;height:92px;display:grid;place-content:center;font:600 22px/1 var(--serif)}
.ring .in small{display:block;font:500 11px var(--font);color:var(--mut);margin-top:3px}
.ring p{white-space:nowrap;margin:8px 0 0;font-size:12px;color:var(--mut)}
.split{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-top:20px;gap:2px}
.split i{display:block;height:100%}
.hide{display:none}

  for(const[h,e]of[['de.wikipedia.org','&prop=pageimages&piprop=thumbnail&pithumbsize=640'],['en.wikipedia.org','&prop=pageimages&piprop=thumbnail&pithumbsize=640'],['commons.wikimedia.org','&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=640']]){try{const u=await pick(h,e);if(u)return u}catch(e){}}

 <div class="sm mut" style="margin-top:10px">Gesättigte Fette liefern ${r0(t.sat*9/Math.max(t.kcal,1)*100)} % der erfassten Kalorien. Für ${r1(Math.max(0,t.f-fk))} g Fett liegen keine Angaben vor.</div></div>`;
 h+=`<div class="card"><details><summary>Vitamine und Mineralstoffe</summary>${mic.length?mic.map(x=>`<div class="mic"><span>${x.nm}</span>${bar(x.v,x.ref)}<span class="num mut" style="text-align:right">${x.v>=100?r0(x.v):r1(x.v)} ${x.u} · ${r0(x.v/x.ref*100)} %</span></div>`).join('')+'<div class="sm mut">% der DGE-Empfehlung pro Tag für Männer (25 bis 65 Jahre). Vitamin D: Wert ohne Eigenproduktion durch Sonne. Nur aus Einträgen mit Datenbank-Angaben, der echte Wert liegt eher höher.</div>':'<div class="sm mut">Für diesen Tag liegen keine Mikronährstoff-Daten vor.</div>'}</details></div>
 <div class="card"><h3 style="margin-top:0">Feedback zum Tag</h3>${fb?`<div class="sm" style="line-height:1.6">${fmt(fb)}</div>`:'<div class="sm mut">Kurze Einschätzung dieses Tages mit Blick auf dein Ziel.</div>'}
 ${fbBusy?'<div class="row" style="margin-top:12px"><div class="spin"></div><span class="sm mut">Werte den Tag aus.</span></div>':`<button class="full" style="margin-top:12px" onclick="A.dayFb()">${fb?'Feedback aktualisieren':'Feedback holen'}</button>`}</div>
 <div class="card"><h3 style="margin-top:0">Einträge</h3>${d.ms.length?d.ms.map(mealRow).join(''):'<div class="sm mut">Keine Einträge.</div>'}</div>`;
 return h}

function vCoach(){
 let h=`<div class="row sp"><h1>Coach</h1>${S.chat.length?'<button onclick="A.chatClear()">Neu beginnen</button>':''}</div>`;
 if(!S.chat.length)h+=`<div class="card"><div class="sm mut" style="margin-bottom:12px">Sprich über deine Ernährung und deinen Lean Bulk oder lass dir Gerichte vorschlagen. Der Coach kennt deine Ziele, deinen bisherigen Tag und die erfassten letzten 14 Tage.</div>${['Was kann ich als Nächstes essen?','Wie war meine Woche bisher?','Esse ich zu viel gesättigtes Fett?'].map(q=>`<button class="full" style="margin-top:8px;text-align:left;border-radius:16px" onclick="A.chatSend(this.textContent)">${q}</button>`).join('')}
 <button class="full" style="margin-top:8px;text-align:left;border-radius:16px" onclick="A.chatFill('Ich habe zuhause: ')">Ich habe … zuhause, was kann ich kochen?</button></div>`;
 h+=S.chat.map((m,mi)=>(m.text?`<div class="msg ${m.role}">${fmt(m.text)}</div>`:'')+(m.sug&&m.sug.length?m.sug.map((v,si)=>sugHTML(v,mi,si)).join('')+'<div class="sm mut" style="margin:0 4px 8px">Nährwerte der Vorschläge sind Richtwerte der KI. Bilder: Symbolbilder aus Wikipedia / Wikimedia Commons.</div>':'')).join('');
 if(chatBusy)h+='<div class="msg ai"><div class="spin"></div></div>';
 return h+`<div class="chatin"><textarea id="c_in" placeholder="Nachricht an den Coach" rows="1"></textarea><button class="pri" onclick="A.chatSend()" ${chatBusy?'disabled':''}>Senden</button></div>`}

function vFav(){let h='<h1>Favoriten</h1>';
 if(!S.favs.length)return h+'<div class="card mut" style="text-align:center">Noch keine Favoriten. Speichere wiederkehrende Gerichte nach der Analyse mit ★, um sie später mit einem Tipp einzutragen.</div>';
 return h+`<div class="sm mut">Gespeicherte Gerichte ohne neue Analyse wieder abrufen.</div>`+S.favs.map(f=>`<div class="card"><div class="row"><div class="th" style="${f.thumb?`background-image:url(${f.thumb})`:''}">${f.thumb?'':IC(ICO.star)}</div><div class="grow"><div class="ell">${esc(f.desc)}</div><div class="sm mut num">${r0(f.tot.kcal)} kcal · K ${r0(f.tot.kh)} · E ${r0(f.tot.p)} · F ${r0(f.tot.f)}</div></div></div>
 <div class="row" style="margin-top:10px"><button class="pri grow" onclick="A.favAdd('${f.id}')">Abrufen</button><button class="dng" onclick="A.favDel('${f.id}')">Entfernen</button></div></div>`).join('')}

function vSet(){
 return `<h1>Einstellungen</h1><div class="card"><h3 style="margin-top:0">Gemini-API</h3>
 <label>API-Schlüssel (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">in Google AI Studio erstellen</a>)</label><input id="s_key" type="password" value="${esc(S.key)}" placeholder="AIza…" autocomplete="off">
 <label>Modell</label>${S.models.length?`<select id="s_model">${[...new Set([S.model,...S.models])].map(m=>`<option ${m===S.model?'selected':''}>${esc(m)}</option>`).join('')}</select>`:`<input id="s_model" value="${esc(S.model)}">`}
 <div class="row" style="margin-top:10px"><button class="pri grow" onclick="A.setSave()">Speichern</button><button onclick="A.models()">Modelle laden</button></div>
 <label>Woher kommen die Nährwerte?</label><select id="s_mode"><option value="db" ${S.mode!=='google'?'selected':''}>Nährwert-Datenbanken (kostenlos)</option><option value="google" ${S.mode==='google'?'selected':''}>Google-Suche (bezahlter Gemini-Tarif nötig)</option></select>
 <label>USDA-Schlüssel (optional, <a href="https://fdc.nal.usda.gov/api-key-signup" target="_blank" rel="noopener">kostenlos anfordern</a>)</label><input id="s_usda" value="${esc(S.usda)}" placeholder="leer = Test-Schlüssel mit kleinem Limit" autocomplete="off">
 <div class="row" style="margin-top:10px"><button class="grow" onclick="A.setSave()">Speichern</button></div>
 <div class="sm mut" style="margin-top:8px">Der Schlüssel bleibt nur in diesem Browser gespeichert und wird ausschließlich an die Google-Schnittstelle gesendet.</div></div>
 ${usageHTML()}
 <div class="card"><h3 style="margin-top:0">Design</h3>
 ${DESIGNS.map(([k,l,t])=>`<button class="dz ${S.ui.design===k?'on':''}" onclick="A.ui('design','${k}')">${l}<small>${t}</small></button>`).join('')}
 <label>Modus</label><div class="seg" style="margin-bottom:6px">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([k,l])=>`<button class="${S.ui.mode===k?'on':''}" onclick="A.ui('mode','${k}')">${l}</button>`).join('')}</div>
 <label>Akzentfarbe</label><div class="row" style="gap:12px;flex-wrap:wrap"><button class="${S.ui.style==='auto'?'pri':''}" style="min-height:44px" onclick="A.ui('style','auto')">Wie Design</button>${STYLES.map(([k,l,c])=>`<button class="sw ${S.ui.style===k?'on':''}" style="background:${c}" aria-label="${l}" title="${l}" onclick="A.ui('style','${k}')"></button>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Ziele</h3><div class="grid2">${[['kcal','Kalorien (kcal)'],['kh','Kohlenhydrate (g)'],['p','Eiweiß (g)'],['f','Fett (g)'],['fib','Ballaststoffe (g)']].map(([k,l])=>`<div><label>${l}</label><input id="g_${k}" inputmode="decimal" value="${esc(S.goals[k])}"></div>`).join('')}</div>
 <label>Dein Ziel in Worten (für Feedback und Coach)</label><textarea id="g_prof" style="min-height:70px">${esc(S.profile)}</textarea>
 <button class="full" style="margin-top:12px" onclick="A.goals()">Ziele speichern</button></div>
 <div class="card"><h3 style="margin-top:0">Datensicherung</h3><p class="sm mut">Alle Daten liegen nur in diesem Browser. Sichere sie regelmäßig als Datei.</p>
 <div class="row"><button class="grow" onclick="A.exp()">Exportieren</button><label class="btn grow" style="text-align:center;color:var(--tx);font-size:16px;margin:0">Importieren<input type="file" accept="application/json,.json" class="hide" onchange="A.imp(this)"></label></div></div>`}

function render(){
 const v={tag:vTag,neu:vNeu,detail:vDetail,woche:vWoche,day:vDay,coach:vCoach,fav:vFav,set:vSet}[view]||vTag;
 const ap=$('#app'),nv=$('#nav'),an=animNext,sd=slideDir;animNext=false;slideDir='';ap.classList.remove('anim','sl','sr');nv.classList.remove('anim');
 ap.innerHTML=v();
 const tab=view==='detail'||view==='fav'?'tag':view==='day'?'woche':view;
 $('#nav').innerHTML=[['neu','cam','Foto'],['tag','hist','Verlauf'],['woche','chart','Statistik'],['coach','chat','Coach'],['set','set','Optionen']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="A.go('${k}')">${IC(ICO[i])}${l}</button>`).join('');
 if(an){void ap.offsetWidth;ap.classList.add('anim');if(sd)ap.classList.add(sd==='l'?'sl':'sr');nv.classList.add('anim');if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))countUp()}
}

/* ---------- Aktionen ---------- */
const A={
 go(v){const prev=view,down=LV(prev)-LV(v);
  if(down>0&&hdepth>0){const k=Math.min(hdepth,down);pend={v,k};try{history.go(-k);return}catch(e){pend=null}}
  view=v;try{if(LV(v)>LV(prev)){history.pushState(hst(),'');hdepth++}else history.replaceState(hst(),'')}catch(e){}
  shown()},
 back(){if(hdepth>0){try{history.back();return}catch(e){}}A.go({detail:'tag',day:'woche',fav:'tag'}[view]||'neu')},
 lim(v){S.lim=S.lim||{};const n=num(v);if(n>0)S.lim[S.model]=n;else delete S.lim[S.model];save();render()},
 week(n){const k=addD(weekOf,7*n);if(k<=monday(today())){weekOf=k;render()}},
 open(id){detail=id;A.go('detail')},
 async img(inp){for(const f of inp.files){try{draft.imgs.push(await readImg(f))}catch(e){toast(e.message)}}inp.value='';render()},
 rmImg(n){draft.imgs.splice(n,1);render()},
 async run(corr){const d=draft,yzCheck=x=>x.kind==='yazio'&&!x.imgs.length;
  if(!corr&&yzCheck(d)){d.err='Bitte zuerst einen Yazio-Screenshot auswählen.';return render()}
  if(!corr&&!d.imgs.length&&!d.text.trim()){d.err='Bitte ein Foto aufnehmen oder die Mahlzeit beschreiben.';return render()}
  const yz=d.kind==='yazio',db=yz||S.mode!=='google';askNotify();runModel=null;usedFallback='';
  d.busy=true;d.err='';d.stage=yz?'Lese Yazio-Einträge.':db?'Erkenne Bestandteile.':'Schritt 1 von 2: Bestandteile erkennen und Nährwerte online recherchieren.';render();lock();
  const len=d.hist.length;
  const addSrc=o=>{const seen=new Set(d.src.map(s=>s.uri));o.src.forEach(s=>{if(!seen.has(s.uri)){seen.add(s.uri);d.src.push(s)}})};
  try{
   const imgs=d.imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}));
   const info=yz?'Screenshot(s) aus Yazio mit meinen eingetragenen Lebensmitteln. '+(d.text.trim()?'Hinweise von mir (haben Vorrang): '+d.text.trim():''):(d.imgs.length?'Foto(s) meiner Mahlzeit. ':'Kein Foto vorhanden, nur Beschreibung. ')+(d.text.trim()?'Zusatzinfos von mir (haben Vorrang): '+d.text.trim():'Keine Zusatzinfos.');
   if(!corr){d.src=[];d.hist=[{role:'user',parts:[...imgs,{text:info}]}]}
   else d.hist.push({role:'user',parts:[{text:'Korrektur von mir (hat Vorrang): '+corr+'\nSuche erneut, wo nötig, führe die Selbstkontrolle durch und antworte wieder ausschließlich mit dem vollständigen JSON-Objekt.'}]});
   let res;
   if(db){dbErr=[];
    const o=await dbLoop(d.hist,names=>{d.stage='Suche in den Nährwert-Datenbanken: '+names.join(', ')+'.';render()},yz?SYS_YZ:SYS_DB);
    const pj=parseJSON(o.text);res=normDB(pj);d.src=res.used;
    if(yz){res.yazio=true;(Array.isArray(pj.uebersprungen)?pj.uebersprungen:[]).forEach(u=>{if(!u||!u.name)return;const hit=S.meals.some(m=>!m.yazio&&m.date===d.date&&Math.abs(r0(m.tot.kcal)-num(u.kcal))<=2);
      res.notes.push(hit?'Übersprungen, weil schon als Foto-Mahlzeit erfasst: '+u.name+' ('+r0(num(u.kcal))+' kcal).':'Achtung: „'+u.name+'“ ('+r0(num(u.kcal))+' kcal) wurde als Schnell-Eintrag übersprungen, aber an diesem Tag gibt es keine Foto-Mahlzeit mit diesen Kalorien. Der Eintrag fehlt in der Statistik.')})}
   }else{
    let o=await gemR(d.hist,SYS,GS);res=norm(parseJSON(o.text));addSrc(o);
    if(!corr){d.stage='Schritt 2 von 2: Gegenprüfung mit zweiter Quelle.';render();
     try{const o2=await gemR([{role:'user',parts:[...imgs,{text:info+'\n\nZu prüfende Analyse:\n'+o.text}]}],SYS_V,GS);const r2=norm(parseJSON(o2.text));addSrc(o2);o=o2;res=r2}
     catch(e){res.notes.push('Die Gegenprüfung ist fehlgeschlagen ('+e.message+'). Angezeigt wird das ungeprüfte Ergebnis des ersten Durchgangs.')}}
    d.hist.push({role:'model',parts:[{text:o.text}]});
   }
   if(usedFallback)res.notes.push('Weil '+S.model+' überlastet oder am Limit war, hat das Ersatzmodell '+usedFallback+' diese Analyse erstellt.');
   d.res=res;d.corr='';
   let m=S.meals.find(x=>x.id===d.mealId);
   if(!m){m={id:uid(),date:yz?d.date:today(),done:yz,yazio:yz,ts:Date.now(),thumb:d.imgs[0]?d.imgs[0].thumb:''};d.mealId=m.id;S.meals.push(m)}
   Object.assign(m,{desc:res.desc,tot:res.tot,comps:res.comps,micros:res.micros,notes:res.notes,check:res.check,ask:res.ask,conf:res.conf,src:d.src.slice()});save();
   notify('Analyse fertig',res.desc+' · '+r0(res.tot.kcal)+' kcal');
  }catch(e){d.err='Fehler: '+e.message;if(corr)d.hist.length=len;notify('Analyse fehlgeschlagen',e.message)}
  d.busy=false;unlock();animNext=!d.err;render();if(usedFallback&&!d.err)toast('Ersatzmodell verwendet: '+usedFallback)},
 analyze(){A.run('')},
 correct(){const c=(draft.corr||'').trim();if(!c)return toast('Bitte Korrektur eingeben');A.run(c)},
 fresh(){newDraft();render();scrollTo(0,0)},
 ui(k,v){S.ui[k]=v;save();applyTheme();render()},
 openDay(k){dayKey=k;A.go('day')},
 async dayFb(){const k=dayKey;fbBusy=true;render();
  try{S.fb[k]=await coach([{role:'user',parts:[{text:'Gib mir Feedback zu meinem Tag '+k+(k===today()?' (heute, der Tag läuft noch)':'')+'. Gliedere in drei kurze Absätze: 1. was gut war, 2. was fehlt oder zu viel war (Makros gegen meine Ziele, Ballaststoffe, gesättigte Fette, auffällige Mikronährstoffe), 3. ein bis zwei konkrete Tipps'+(k===today()?' für den Rest des Tages.':' für die nächsten Tage.')}]}]);save()}
  catch(e){toast('Fehler: '+e.message)}fbBusy=false;render()},
 async chatSend(q){const t=(q||($('#c_in')&&$('#c_in').value)||'').trim();if(!t||chatBusy)return;
  S.chat.push({role:'user',text:t});chatBusy=true;render();scrollTo(0,document.body.scrollHeight);
  try{let h=S.chat.slice(-16);while(h.length&&h[0].role!=='user')h.shift();
   const a=await coachChat(h.map(m=>({role:m.role==='ai'?'model':'user',parts:[{text:m.role==='ai'?(m.raw||m.text):m.text}]})));
   S.chat.push({role:'ai',text:a.text,raw:a.raw,sug:a.sug});if(S.chat.length>60)S.chat=S.chat.slice(-60);save()}
  catch(e){S.chat.pop();toast('Fehler: '+e.message)}
  chatBusy=false;animNext=true;render();
  const ms=document.querySelectorAll('.msg.user');if(ms.length)ms[ms.length-1].scrollIntoView({block:'start',behavior:'smooth'});
  loadSugImgs()},
 chatFill(t){const e=$('#c_in');if(e){e.value=t;e.focus()}},
 sugLog(mi,si){const v=S.chat[mi]&&S.chat[mi].sug&&S.chat[mi].sug[si];if(!v)return;newDraft();draft.text=v.name+': '+v.ing.map(z=>(z.g?r0(z.g)+' g ':'')+z.name).join(', ');A.go('neu');toast('Zutaten übernommen. Mengen anpassen und analysieren.')},
 chatClear(){S.chat=[];save();render()},
 goals(){['kcal','kh','p','f','fib'].forEach(k=>{const v=num($('#g_'+k).value);if(v>0)S.goals[k]=v});S.profile=$('#g_prof').value.trim()||S.profile;save();toast('Ziele gespeichert')},
 kind(k){if(draft.busy)return;newDraft();draft.kind=k;render()},
 favDraft(){const m=S.meals.find(x=>x.id===draft.mealId);if(!m)return;S.favs.unshift(Object.assign(JSON.parse(JSON.stringify(m)),{id:uid()}));save();toast('Als Favorit gespeichert')},
 done(){const m=S.meals.find(x=>x.id===detail);m.done=!m.done;save();render()},
 del(){S.meals=S.meals.filter(x=>x.id!==detail);save();A.go('tag');toast('Gelöscht')},
 fav(){const m=S.meals.find(x=>x.id===detail);S.favs.unshift(Object.assign({},m,{id:uid()}));save();toast('Als Favorit gespeichert')},
 favAdd(id){const f=S.favs.find(x=>x.id===id);const m=Object.assign(JSON.parse(JSON.stringify(f)),{id:uid(),date:today(),done:false,ts:Date.now()});S.meals.push(m);save();detail=m.id;A.go('detail');toast('Eingetragen')},
 favDel(id){S.favs=S.favs.filter(x=>x.id!==id);save();render()},
 setSave(){S.key=$('#s_key').value.trim();S.model=$('#s_model').value.trim()||S.model;S.mode=$('#s_mode').value;S.usda=$('#s_usda').value.trim();save();toast('Gespeichert');if(S.key&&!S.models.length)A.models();else if(S.key)A.go('neu')},
 async models(){const key=$('#s_key').value.trim();if(!key)return toast('Erst API-Schlüssel eintragen');S.key=key;
  try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'HTTP '+r.status);
   S.models=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>/^gemini-/.test(n)&&!/image|tts|audio|live|embedding|computer|transcribe|customtools|robotics/.test(n)).sort();
   const fl=S.models.map(n=>({n,v:(n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/)||[])[1]})).filter(x=>x.v).sort((a,b)=>parseFloat(b.v)-parseFloat(a.v));
   if(!S.models.includes(S.model))S.model=S.models.includes('gemini-3.5-flash')?'gemini-3.5-flash':(fl.length?fl[0].n:S.model);
   save();render();toast(S.models.length+' Modelle geladen, aktiv: '+S.model)}catch(e){toast('Fehler: '+e.message)}},
 exp(){const b=new Blob([JSON.stringify(Object.assign({},S,{key:''}),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='makro-tracker-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()},
 async imp(inp){const f=inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.meals))throw new Error('Keine gültige Sicherung');const key=S.key;S=Object.assign(S,j);S.key=j.key||key;S.ui=Object.assign({design:'edel',mode:'dark',style:'auto'},S.ui||{});save();applyTheme();render();toast('Importiert: '+S.meals.length+' Mahlzeiten')}catch(e){toast('Fehler: '+e.message)}}
};

load();applyTheme();newDraft();if(!S.key)view='set';try{history.replaceState(hst(),'')}catch(e){}render();
</script>
